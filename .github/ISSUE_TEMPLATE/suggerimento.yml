name: Suggerimento
description: Idea, problema o domanda sul minisito, sulla guida o sul template
title: "[Suggerimento] "
labels: []
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - Miglioramento
        - Problema
        - Domanda
        - Nuova fonte o pagina
    validations:
      required: true
  - type: input
    id: sezione
    attributes:
      label: Sezione (opzionale)
      placeholder: Es. Riuso / guida
  - type: textarea
    id: messaggio
    attributes:
      label: Descrizione
    validations:
      required: true
